#
# Publish to PyPI when a version tag (vX.Y.Z) reaches the GitHub mirror.
# Tags are created on codebase.helmholtz.cloud and mirrored here; PyPI trusted
# publishing (OIDC) does not support self-managed GitLab, so publishing runs on
# the mirror. No API token is stored anywhere.
#
# One-time setup on pypi.org (Account settings -> Publishing -> add a pending
# publisher, or the project's Publishing settings once it exists):
#   PyPI project name: pysewer   owner: ddspot   repository: pysewer
#   workflow: publish.yml        environment: pypi

name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tag must match the package version
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"; exit 1
          fi
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Install the wheel in a clean venv and import it
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          /tmp/clean/bin/python -c "import pysewer; from importlib.metadata import version; print('pysewer', version('pysewer'))"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
